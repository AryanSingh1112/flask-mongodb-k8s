# NodePort: reachable in-cluster (flask-service:80) AND from your laptop via
# `minikube service flask-service -n flask-app --url`
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: flask-app
  labels:
    app: flask-app
spec:
  type: NodePort
  selector:
    app: flask-app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080