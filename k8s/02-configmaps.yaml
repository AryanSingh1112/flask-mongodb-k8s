apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-config
  namespace: flask-app
data:
  # "mongodb" is the ClusterIP Service name; CoreDNS resolves it inside the namespace.
  MONGO_HOST: "mongodb"
  MONGO_PORT: "27017"
  MONGO_DB: "flask_db"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: flask-app
data:
  # Executed ONCE by the official image, only when /data/db is empty (first boot).
  # Creates a least-privilege application user in addition to the root user.
  01-create-app-user.js: |
    const appDb = process.env.MONGO_APP_DB;
    db = db.getSiblingDB(appDb);
    db.createUser({
      user: process.env.MONGO_APP_USERNAME,
      pwd:  process.env.MONGO_APP_PASSWORD,
      roles: [{ role: "readWrite", db: appDb }]
    });
    print("Created application user in database " + appDb);