# DEMO CREDENTIALS - for a local Minikube exercise only.
# In any real environment do NOT commit this file: create the Secret out-of-band
# (kubectl create secret ...), or use Sealed Secrets / External Secrets / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: flask-app
type: Opaque
stringData:
  # Root/admin user: used only by MongoDB's init process, never by the app.
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: "Adm1n-ChangeMe-2026"
  # Application user: readWrite on flask_db only (least privilege).
  MONGO_APP_USERNAME: flaskuser
  MONGO_APP_PASSWORD: "Fl4sk-ChangeMe-2026"